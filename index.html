<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StaffSync | Zero-Install Dashboard</title>

    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Axios -->
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }

        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .animate-fade-in {
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0f172a',
                        accent: '#3b82f6',
                    },
                    borderRadius: {
                        '3xl': '1.5rem',
                        '4xl': '2rem',
                    }
                }
            }
        }
    </script>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- API Configuration ---
        const API_BASE_URL = "https://7hl4mss9-44333.inc1.devtunnels.ms";
        const api = axios.create({
            baseURL: API_BASE_URL,
            headers: { 'Content-Type': 'application/json' }
        });

        // Add interceptor for auth token
        api.interceptors.request.use(config => {
            const token = localStorage.getItem('token');
            if (token) config.headers.Authorization = `Bearer ${token}`;
            return config;
        });

        // --- Icons Wrapper ---
        const Icon = ({ name, size = 20, className = "" }) => {
            return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
        };

        // --- Components ---

        const Login = ({ onLoginSuccess }) => {
            const [username, setUsername] = useState('admin');
            const [password, setPassword] = useState('111111');
            const [isLoading, setIsLoading] = useState(false);
            const [error, setError] = useState('');

            const handleLogin = async (e) => {
                e.preventDefault();
                setIsLoading(true);
                setError('');
                try {
                    const res = await api.post('/api/Auth/login', { username, password });
                    if (res.data.success) {
                        localStorage.setItem('token', res.data.data.token);
                        localStorage.setItem('username', username);
                        onLoginSuccess();
                    } else {
                        setError(res.data.message);
                    }
                } catch (err) {
                    setError("Failed to connect to API. Is your tunnel running?");
                } finally {
                    setIsLoading(false);
                }
            };

            return (
                <div className="min-h-screen flex items-center justify-center bg-slate-900 p-4 relative overflow-hidden">
                    <div className="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] bg-blue-600/20 blur-[120px] rounded-full"></div>
                    <div className="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] bg-indigo-600/20 blur-[120px] rounded-full"></div>

                    <div className="w-full max-w-md relative z-10 animate-fade-in">
                        <div className="glass p-10 rounded-4xl shadow-2xl">
                            <div className="text-center mb-10">
                                <div className="w-20 h-20 bg-blue-600 rounded-3xl flex items-center justify-center text-white mx-auto mb-6 shadow-2xl shadow-blue-500/40">
                                    <Icon name="lock" size={32} />
                                </div>
                                <h1 className="text-3xl font-bold text-slate-800 mb-2">StaffSync</h1>
                                <p className="text-slate-500 font-medium">Modern Employee Management</p>
                            </div>

                            {error && (
                                <div className="mb-6 p-4 bg-red-50 border border-red-200 text-red-600 rounded-2xl text-sm font-semibold flex items-center gap-2">
                                    <Icon name="alert-circle" size={18} /> {error}
                                </div>
                            )}

                            <form onSubmit={handleLogin} className="space-y-6">
                                <div className="space-y-2">
                                    <label className="text-sm font-bold text-slate-600 ml-1">Username</label>
                                    <div className="relative">
                                        <div className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"><Icon name="user" size={18} /></div>
                                        <input
                                            type="text"
                                            value={username}
                                            onChange={e => setUsername(e.target.value)}
                                            className="w-full bg-slate-50 border border-slate-200 pl-12 pr-4 py-4 rounded-2xl focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500/50 outline-none transition-all"
                                            required
                                        />
                                    </div>
                                </div>
                                <div className="space-y-2">
                                    <label className="text-sm font-bold text-slate-600 ml-1">Password</label>
                                    <div className="relative">
                                        <div className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"><Icon name="key" size={18} /></div>
                                        <input
                                            type="password"
                                            value={password}
                                            onChange={e => setPassword(e.target.value)}
                                            className="w-full bg-slate-50 border border-slate-200 pl-12 pr-4 py-4 rounded-2xl focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500/50 outline-none transition-all"
                                            required
                                        />
                                    </div>
                                </div>
                                <button
                                    type="submit"
                                    disabled={isLoading}
                                    className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-2xl shadow-xl shadow-blue-500/20 transition-all active:scale-[0.98] disabled:opacity-70"
                                >
                                    {isLoading ? "Signing In..." : "Sign In"}
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            );
        };

        const Dashboard = ({ employees }) => {
            const totalSalary = employees.reduce((sum, e) => sum + e.salary, 0);

            return (
                <div className="space-y-8 animate-fade-in">
                    <div>
                        <h1 className="text-2xl font-bold text-slate-800">Dashboard</h1>
                        <p className="text-slate-500">Welcome back to your company overview.</p>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm">
                            <div className="w-12 h-12 bg-blue-600 rounded-2xl flex items-center justify-center text-white mb-4"><Icon name="users" /></div>
                            <p className="text-sm font-medium text-slate-500">Total Employees</p>
                            <h3 className="text-2xl font-bold text-slate-800">{employees.length}</h3>
                        </div>
                        <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm">
                            <div className="w-12 h-12 bg-emerald-600 rounded-2xl flex items-center justify-center text-white mb-4"><Icon name="dollar-sign" /></div>
                            <p className="text-sm font-medium text-slate-500">Monthly Payroll</p>
                            <h3 className="text-2xl font-bold text-slate-800">${totalSalary.toLocaleString()}</h3>
                        </div>
                        <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm">
                            <div className="w-12 h-12 bg-indigo-600 rounded-2xl flex items-center justify-center text-white mb-4"><Icon name="trending-up" /></div>
                            <p className="text-sm font-medium text-slate-500">Active Roles</p>
                            <h3 className="text-2xl font-bold text-slate-800">{Math.floor(employees.length * 0.9)}</h3>
                        </div>
                    </div>

                    <div className="bg-white p-8 rounded-4xl border border-slate-200 shadow-sm">
                        <h3 className="text-lg font-bold text-slate-800 mb-6">Recent Additions</h3>
                        <div className="space-y-4">
                            {(employees || []).slice(-3).reverse().map(emp => (
                                <div key={emp.id} className="flex items-center gap-4 p-4 hover:bg-slate-50 rounded-2xl transition-colors">
                                    <div className="w-10 h-10 bg-slate-100 rounded-full flex items-center justify-center text-slate-600 font-bold">{emp.name[0]}</div>
                                    <div className="flex-1">
                                        <p className="text-sm font-bold text-slate-800">{emp.name}</p>
                                        <p className="text-xs text-slate-500">{emp.email}</p>
                                    </div>
                                    <span className="text-xs font-bold text-blue-600 bg-blue-50 px-3 py-1 rounded-full">${emp.salary.toLocaleString()}</span>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        const EmployeeList = ({ employees, onEdit, onDelete, onAdd, searchTerm, setSearchTerm }) => {
            return (
                <div className="space-y-6 animate-fade-in">
                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                        <div>
                            <h1 className="text-2xl font-bold text-slate-800">Staff Directory</h1>
                            <p className="text-slate-500">Manage your workforce from one place.</p>
                        </div>
                        <button
                            onClick={onAdd}
                            className="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-2xl font-bold flex items-center gap-2 shadow-lg shadow-blue-200 transition-all active:scale-[0.98]"
                        >
                            <Icon name="plus" /> Add Staff
                        </button>
                    </div>

                    <div className="bg-white rounded-4xl border border-slate-200 shadow-sm overflow-hidden">
                        <div className="p-6 border-b border-slate-100 bg-slate-50/50">
                            <div className="relative">
                                <div className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"><Icon name="search" size={18} /></div>
                                <input
                                    type="text"
                                    placeholder="Search by name, email..."
                                    className="w-full bg-white border border-slate-200 pl-12 pr-4 py-3 rounded-2xl outline-none focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500/50 transition-all"
                                    value={searchTerm}
                                    onChange={e => setSearchTerm(e.target.value)}
                                />
                            </div>
                        </div>
                        <div className="overflow-x-auto">
                            <table className="w-full">
                                <thead className="bg-slate-50/50">
                                    <tr>
                                        <th className="text-left p-6 text-xs font-bold text-slate-400 uppercase tracking-wider">Employee</th>
                                        <th className="text-left p-6 text-xs font-bold text-slate-400 uppercase tracking-wider">Contact</th>
                                        <th className="text-left p-6 text-xs font-bold text-slate-400 uppercase tracking-wider">Salary</th>
                                        <th className="text-right p-6 text-xs font-bold text-slate-400 uppercase tracking-wider">Actions</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-100">
                                    {(employees || []).map(emp => (
                                        <tr key={emp.id} className="hover:bg-slate-50/50 transition-colors group">
                                            <td className="p-6">
                                                <div className="flex items-center gap-4">
                                                    <div className="w-10 h-10 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center font-bold">{emp.name[0]}</div>
                                                    <p className="font-bold text-slate-800">{emp.name}</p>
                                                </div>
                                            </td>
                                            <td className="p-6">
                                                <div className="text-sm text-slate-600">
                                                    <p className="flex items-center gap-2"><Icon name="mail" size={12} /> {emp.email}</p>
                                                    <p className="flex items-center gap-2"><Icon name="phone" size={12} /> {emp.phone}</p>
                                                </div>
                                            </td>
                                            <td className="p-6">
                                                <span className="font-bold text-slate-800">${emp.salary.toLocaleString()}</span>
                                            </td>
                                            <td className="p-6 text-right">
                                                <div className="flex justify-end gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                                                    <button onClick={() => onEdit(emp)} className="p-2 text-slate-400 hover:text-blue-600 hover:bg-blue-50 rounded-xl transition-all"><Icon name="edit-2" size={18} /></button>
                                                    <button onClick={() => onDelete(emp.id)} className="p-2 text-slate-400 hover:text-red-600 hover:bg-red-50 rounded-xl transition-all"><Icon name="trash-2" size={18} /></button>
                                                </div>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        };

        const EmployeeForm = ({ employee, onSave, onCancel }) => {
            const [formData, setFormData] = useState(employee || { name: '', email: '', phone: '', salary: '' });
            const [isLoading, setIsLoading] = useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setIsLoading(true);
                try {
                    await onSave(formData);
                } finally {
                    setIsLoading(false);
                }
            };

            return (
                <div className="max-w-2xl mx-auto space-y-8 animate-fade-in">
                    <div className="flex items-center gap-4">
                        <button onClick={onCancel} className="p-2 hover:bg-white rounded-xl text-slate-400 hover:text-slate-800 transition-all border border-transparent hover:border-slate-200"><Icon name="arrow-left" /></button>
                        <h1 className="text-2xl font-bold text-slate-800">{employee ? "Edit Staff" : "Add New Staff"}</h1>
                    </div>

                    <form onSubmit={handleSubmit} className="bg-white p-10 rounded-4xl border border-slate-200 shadow-xl space-y-8">
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                            <div className="space-y-2">
                                <label className="text-sm font-bold text-slate-600 ml-1">Full Name</label>
                                <input
                                    className="w-full bg-slate-50 border border-slate-200 p-4 rounded-2xl focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500/50 outline-none transition-all"
                                    value={formData.name}
                                    onChange={e => setFormData({ ...formData, name: e.target.value })}
                                    required
                                />
                            </div>
                            <div className="space-y-2">
                                <label className="text-sm font-bold text-slate-600 ml-1">Email</label>
                                <input
                                    type="email"
                                    className="w-full bg-slate-50 border border-slate-200 p-4 rounded-2xl focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500/50 outline-none transition-all"
                                    value={formData.email}
                                    onChange={e => setFormData({ ...formData, email: e.target.value })}
                                    required
                                />
                            </div>
                            <div className="space-y-2">
                                <label className="text-sm font-bold text-slate-600 ml-1">Phone</label>
                                <input
                                    className="w-full bg-slate-50 border border-slate-200 p-4 rounded-2xl focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500/50 outline-none transition-all"
                                    value={formData.phone}
                                    onChange={e => setFormData({ ...formData, phone: e.target.value })}
                                    required
                                />
                            </div>
                            <div className="space-y-2">
                                <label className="text-sm font-bold text-slate-600 ml-1">Salary</label>
                                <input
                                    type="number"
                                    className="w-full bg-slate-50 border border-slate-200 p-4 rounded-2xl focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500/50 outline-none transition-all"
                                    value={formData.salary}
                                    onChange={e => setFormData({ ...formData, salary: parseInt(e.target.value) || 0 })}
                                    required
                                />
                            </div>
                        </div>
                        <div className="flex justify-end gap-4 pt-8 border-t border-slate-100">
                            <button type="button" onClick={onCancel} className="px-8 py-3 text-slate-600 font-bold hover:bg-slate-50 rounded-2xl">Discard</button>
                            <button type="submit" disabled={isLoading} className="bg-blue-600 hover:bg-blue-700 text-white px-10 py-3 rounded-2xl font-bold shadow-lg shadow-blue-200 transition-all flex items-center gap-2">
                                <Icon name="save" /> {isLoading ? "Saving..." : "Save Details"}
                            </button>
                        </div>
                    </form>
                </div>
            );
        };

        // --- Main App Controller ---

        const App = () => {
            const [page, setPage] = useState('dashboard');
            const [isLoggedIn, setIsLoggedIn] = useState(!!localStorage.getItem('token'));
            const [employees, setEmployees] = useState([]);
            const [editingEmployee, setEditingEmployee] = useState(null);
            const [searchTerm, setSearchTerm] = useState('');
            const [isLoading, setIsLoading] = useState(false);

            useEffect(() => {
                if (isLoggedIn) fetchEmployees();
            }, [isLoggedIn]);

            useEffect(() => {
                lucide.createIcons();
            }, [page, employees, isLoggedIn]);

            const fetchEmployees = async () => {
                setIsLoading(true);
                try {
                    const res = await api.get('/api/Employee');
                    if (res.data.success) setEmployees(res.data.data);
                } catch (err) {
                    console.error("Fetch failed", err);
                } finally {
                    setIsLoading(false);
                }
            };

            const handleSave = async (data) => {
                try {
                    const res = editingEmployee
                        ? await api.put(`/api/Employee/${editingEmployee.id}`, data)
                        : await api.post('/api/Employee', data);

                    if (res.data.success) {
                        await fetchEmployees();
                        setPage('employees');
                    }
                } catch (err) {
                    alert("Operation failed. Please check your connection.");
                }
            };

            const handleDelete = async (id) => {
                if (!confirm("Are you sure?")) return;
                try {
                    const res = await api.delete(`/api/Employee/${id}`);
                    if (res.data.success) fetchEmployees();
                } catch (err) {
                    alert("Delete failed.");
                }
            };

            const filteredEmployees = useMemo(() => {
                return (employees || []).filter(e => 
                    (e.name || "").toLowerCase().includes(searchTerm.toLowerCase()) || 
                    (e.email || "").toLowerCase().includes(searchTerm.toLowerCase())
                );
            }, [employees, searchTerm]);

            if (!isLoggedIn) return <Login onLoginSuccess={() => setIsLoggedIn(true)} />;

            return (
                <div className="flex min-h-screen">
                    {/* Sidebar */}
                    <aside className="w-72 bg-white border-r border-slate-200 hidden lg:flex flex-col p-8 fixed h-full shadow-sm">
                        <div className="flex items-center gap-3 mb-12 px-2">
                            <div className="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white shadow-lg shadow-blue-200">
                                <Icon name="users" size={24} />
                            </div>
                            <span className="text-xl font-bold text-slate-800 tracking-tight">StaffSync</span>
                        </div>

                        <nav className="flex-1 space-y-2">
                            <button
                                onClick={() => setPage('dashboard')}
                                className={`w-full flex items-center gap-3 px-5 py-4 rounded-2xl transition-all ${page === 'dashboard' ? 'bg-blue-600 text-white shadow-xl shadow-blue-200' : 'text-slate-500 hover:bg-slate-50'}`}
                            >
                                <Icon name="layout-dashboard" /> <span className="font-bold">Dashboard</span>
                            </button>
                            <button
                                onClick={() => setPage('employees')}
                                className={`w-full flex items-center gap-3 px-5 py-4 rounded-2xl transition-all ${page === 'employees' || page === 'form' ? 'bg-blue-600 text-white shadow-xl shadow-blue-200' : 'text-slate-500 hover:bg-slate-50'}`}
                            >
                                <Icon name="users" /> <span className="font-bold">Directory</span>
                            </button>
                        </nav>

                        <button
                            onClick={() => { localStorage.clear(); setIsLoggedIn(false); }}
                            className="flex items-center gap-3 px-5 py-4 text-red-500 font-bold hover:bg-red-50 rounded-2xl transition-all mt-auto"
                        >
                            <Icon name="log-out" /> Logout
                        </button>
                    </aside>

                    {/* Main */}
                    <main className="flex-1 lg:ml-72 p-6 lg:p-12">
                        <header className="flex justify-between items-center mb-12 bg-white p-6 rounded-4xl border border-slate-200 shadow-sm">
                            <div className="flex items-center gap-4">
                                <div className="w-10 h-10 bg-slate-100 rounded-full flex items-center justify-center text-slate-600"><Icon name="user" /></div>
                                <div>
                                    <p className="text-sm font-bold text-slate-800">{localStorage.getItem('username')}</p>
                                    <p className="text-xs text-slate-400 font-medium">Administrator</p>
                                </div>
                            </div>
                            {isLoading && <Icon name="loader-2" size={24} className="animate-spin text-blue-600" />}
                        </header>

                        <div className="max-w-6xl mx-auto">
                            {page === 'dashboard' && <Dashboard employees={employees} />}
                            {page === 'employees' && (
                                <EmployeeList
                                    employees={filteredEmployees}
                                    searchTerm={searchTerm}
                                    setSearchTerm={setSearchTerm}
                                    onAdd={() => { setEditingEmployee(null); setPage('form'); }}
                                    onEdit={(emp) => { setEditingEmployee(emp); setPage('form'); }}
                                    onDelete={handleDelete}
                                />
                            )}
                            {page === 'form' && (
                                <EmployeeForm
                                    employee={editingEmployee}
                                    onSave={handleSave}
                                    onCancel={() => setPage('employees')}
                                />
                            )}
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
